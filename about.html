			<h1>本当に美味しい珈琲を提供してお客様に喜びを</h1>
			<figure>

					25年の無機質なコンクリートの建物をリノベーションした広い店内は、どこか懐かしく、どこか新しいこだわりの空間。そんな非日常的な雰囲気の中、美味しいコーヒーを呑みながらそれぞれのスタイルで安らぎの一時をお楽しみください。コーヒーを軸にたくさんの何かに出会える、地域に必要とされる場を私たちは目指しております。
